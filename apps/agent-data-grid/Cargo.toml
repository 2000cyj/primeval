[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Primeval"]

[workspace.dependencies]
# internal
ide-core = { path = "crates/ide-core" }
ide-ssh = { path = "crates/ide-ssh" }
ide-db = { path = "crates/ide-db" }

# serialization & IPC typing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"

# async & concurrency
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
parking_lot = "0.12"
futures = "0.3"

# errors & diagnostics
thiserror = "2"
tracing = "0.1"

# fs
dunce = "1"
dirs = "6"
encoding_rs = "0.8"

# protocols & integrations
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "postgres", "mysql"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "sql-browser-tokio"] }
bb8 = "0.9"

# testing
tempfile = "3"

[profile.dev]
opt-level = 0
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = "debuginfo"
