[package]
name = "agentspace-cli"
version = "0.1.0"
description = "agentspace —— 按智能体定义准备目录并拉起对应的 agent"
edition = "2021"

[[bin]]
name = "agentspace"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "socks"] }
flate2 = "1.1.11"
clap = { version = "4", features = ["derive"] }
# 刷新 skill / URL 导入要发请求 —— reqwest 需要一个运行时。
tokio = { version = "1", features = ["rt-multi-thread"] }

[dependencies.agentspace-core]
path = "../agentspace-core"

[profile.release]
strip = true
