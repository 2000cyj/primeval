[package]
name = "agent-compose"
version = "1.0.1"
description = "AgentCompose desktop UI"
authors = ["Primeval"]
edition = "2021"

[lib]
name = "agent_compose_lib"
# 只保留 rlib：本项目目前只有 Windows 桌面端。
# 模板里默认的 "cdylib" 在 windows-gnu 上链接会失败 ——
# cdylib 会导出全部可达符号，GNU ld 报 "export ordinal too large: 90962"
# （PE 导出序号的 65535 上限），与 dlltool/工具链无关。
# 真要做移动端时，在对应 target 下再加回 "cdylib"/"staticlib"。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 共享核心：智能体 / skill / 工具箱 / 代理的落盘与业务逻辑。
# CLI（apps/agentspace-cli）也依赖它 —— 一套数据，两个客户端。
agentspace-core = { path = "../../agentspace-core" }
tauri = { version = "2", features = [] }
# 应用内更新：官方 updater 插件。
# 跟 cc-switch 一样用它 —— 检测、下载、验签、交给 NSIS 装好并重启，全在应用内完成。
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 默认 feature 即 rustls，无需 native-tls / openssl
# socks：支持 socks4 / socks5 代理（全局出站代理里用户填的就是这类地址）
reqwest = { version = "0.13", features = ["json", "socks"] }
url = "2"
tauri-plugin-dialog = "2.8.4"
flate2 = "1.1.11"
