name: Release

# 打 tag 触发发布：
#   git tag v1.0.0 && git push origin v1.0.0
#
# tag 的版本号会写进 tauri.conf.json，产物名跟着走：
#   AgentSpace_1.0.0_x64-setup.exe
#   AgentSpace_1.0.0_x64_portable.zip
on:
  push:
    tags:
      - 'v*'
  # 手动触发：只跑构建，把产物挂到 Actions 页面上（不发 Release）。
  # 用来验证「CI 上能不能构建出来」。
  workflow_dispatch:

permissions:
  contents: write

env:
  # 产物目录（tauri 的 bundle 输出）
  BUNDLE_DIR: apps/AgentCompose/src-tauri/target/release/bundle

jobs:
  build:
    name: 构建 Windows 安装包
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ── Node / pnpm ────────────────────────────────────────
      #
      # 顺序有讲究：**先装 pnpm，再 setup-node**。
      #
      # setup-node 的 `cache: pnpm` 会立刻调用 pnpm 去定位 store 目录 ——
      # pnpm 不在 PATH 上就直接报
      #「Unable to locate executable file: pnpm」而整个 job 挂掉。
      # pnpm/action-setup 不带 version 时读 package.json 的 packageManager
      # 字段（pnpm@10.18.1），版本不会漂。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      # ── Bun（构建 MCP sidecar 用）────────────────────────────
      - name: 装 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── Rust ────────────────────────────────────────────────
      #
      # 用 MSVC 工具链（runner 自带）。不需要本机那套 MSYS2 MinGW-w64 ——
      # 那是本机 rustup 的 GNU 工具链 spawn 不了自带 dlltool.exe 的绕法
      # （见 apps/AgentCompose/scripts/tauri.mjs 顶部的说明）。
      # CI 上没有那个问题，探针的 default 策略就够。
      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/agentspace-core -> target
            apps/agentspace-cli -> target
            apps/AgentCompose/src-tauri -> target

      # ── 版本号：从 tag 取，写进 tauri.conf.json ─────────────
      - name: 写入版本号
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Host "不是版本 tag（$tag），用 tauri.conf.json 里现有的版本号"
            exit 0
          }
          $version = $tag.TrimStart('v')
          $conf = 'apps/AgentCompose/src-tauri/tauri.conf.json'
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $json.version = $version
          $json | ConvertTo-Json -Depth 10 | Set-Content $conf -Encoding utf8
          Write-Host "版本号设为 $version"

      # ── 构建随包分发的两个可执行文件 ───────────────────────
      #
      # tauri.conf.json 的 bundle.resources 引用了它们 ——
      # 不先构建，tauri build 会因为找不到文件而失败。
      - name: 构建 agentspace CLI
        run: node apps/AgentCompose/scripts/build-cli.mjs

      - name: 构建 MCP sidecar
        run: node apps/AgentCompose/scripts/build-sidecar.mjs

      - name: 确认产物齐全
        shell: pwsh
        run: |
          $bin = 'apps/AgentCompose/src-tauri/bin'
          foreach ($f in @('agentspace.exe', 'agent-compose-mcp.exe')) {
            if (-not (Test-Path "$bin/$f")) {
              Write-Error "缺 $f"
              exit 1
            }
            Write-Host "OK $f"
          }

      # ── 构建安装包 ─────────────────────────────────────────
      #
      # 只做 nsis（配置里写的是 "all"，会连带构建 msi/deb/rpm/appimage ——
      # msi 要额外下 wix 工具链，deb/rpm 要额外工具链，Windows 上也不需要）。
      - name: 构建安装包
        env:
          # CI 上工具链是干净的 MSVC，不用跑探针
          AGENT_COMPOSE_SKIP_PROBE: '1'
        run: pnpm --filter @remote/agent-compose run tauri build --bundles nsis

      # ── 打便携版 zip（免安装）──────────────────────────────
      #
      # Tauri 的 resources 在 Windows 上解到 exe 同级目录并保持相对路径，
      # 所以 bin/ 要跟 exe 平级 —— 跟安装版里的布局一致。
      - name: 打便携版 zip
        shell: pwsh
        run: |
          $version = (Get-Content 'apps/AgentCompose/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $stage = Join-Path $env:RUNNER_TEMP 'portable'
          New-Item -ItemType Directory -Force -Path "$stage/bin" | Out-Null
          Copy-Item 'apps/AgentCompose/src-tauri/target/release/agent-compose.exe' "$stage/AgentSpace.exe"
          Copy-Item 'apps/AgentCompose/src-tauri/bin/*' "$stage/bin"
          $zip = Join-Path $env:RUNNER_TEMP "AgentSpace_${version}_x64_portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item $zip 'dist/'
          Write-Host "生成 dist/AgentSpace_${version}_x64_portable.zip"

      # ── 汇总上传 ───────────────────────────────────────────
      - name: 汇总产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item "${{ env.BUNDLE_DIR }}/nsis/*.exe" 'dist/'
          Get-ChildItem 'dist' | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: agentspace-windows
          path: dist/
          if-no-files-found: error

  # ── 发布 ───────────────────────────────────────────────────
  #
  # 只在 tag push 时跑。手动触发只跑上面的 build（产物去 Actions 页面下载）。
  release:
    name: 发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agentspace-windows
          path: dist

      # ── 发布说明 ───────────────────────────────────────────
      #
      # 优先用 docs/release-notes/<tag>.md —— 那个是手写的，
      # 写清楚这一版新增了什么、修了什么。
      #
      # 没有的话退回默认模板：只有安装说明和命令行用法。
      # （模板里不硬写「更新了什么」—— 那种内容写死就会过期，
      #   下个版本还挂着上个版本的总结，比没有更糟。）
      - name: 生成发布说明
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $notes = "docs/release-notes/$tag.md"
          if (Test-Path $notes) {
            Copy-Item $notes 'dist/release-notes.md'
            Write-Host "用 $notes 作发布说明"
          } else {
            $body = @"
            ## AgentSpace $tag

            Windows 安装包（x64）。

            | 格式 | 说明 |
            | --- | --- |
            | `AgentSpace_*_x64-setup.exe` | NSIS 安装包，双击一路下一步 |
            | `AgentSpace_*_x64_portable.zip` | 便携版，解压即用，不写注册表 |

            装的是 AgentSpace 桌面端 —— 智能体、Skills、MCP server、Pi 扩展
            收在一处管。命令行 ``agentspace`` 会一起装上。

            ### 安装

            - **EXE**：双击安装。装完在开始菜单里找 AgentSpace。
            - **便携版**：解压后直接跑 `AgentSpace.exe`。

            ### 命令行

            ```bash
            agentspace run <智能体名>   # 按智能体定义准备目录并拉起 Pi
            agentspace install <智能体名>  # 只落地配置，不启动 Pi
            agentspace update <智能体名>    # 覆盖更新已装好的配置
            agentspace skill list      # 看有哪些 skill
            agentspace mcp list        # 看有哪些 MCP server
            agentspace extension list  # 看有哪些 Pi 扩展
            ```

            > 安装包未签名，Windows SmartScreen 可能拦一下 ——
            > 「更多信息 → 仍要运行」。
            "@
            Set-Content -Path 'dist/release-notes.md' -Value $body -Encoding utf8
            Write-Host "没有 $notes，用默认模板"
          }

      # ── 版本清单 ───────────────────────────────────────────
      #
      # 桌面端的「检查最新版本」读的就是这个文件。
      #
      # 为什么不用 GitHub API：未认证请求 60 次/小时，而且**按 IP 算** ——
      # 共享网络里很容易被打满，检测功能会时好时坏。挂在 release 上的
      # 静态文件走 CDN，没有这个限制。
      - name: 生成版本清单
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $setup = Get-ChildItem 'dist' -Filter '*_x64-setup.exe' | Select-Object -First 1
          $portable = Get-ChildItem 'dist' -Filter '*_x64_portable.zip' | Select-Object -First 1
          if (-not $setup) { Write-Error '找不到安装包'; exit 1 }

          $base = "https://github.com/2000cyj/primeval/releases/download/$tag"
          # 注意：Get-Content -Raw 的结果带 PSObject 适配器属性（PSPath 等），
          # 直接扔进 ConvertTo-Json 会把那些属性一起序列化，notes 变成一个
          # 几百 KB 的对象而不是字符串 —— 客户端解析会直接失败。
          # 用 [string] 强转成纯字符串。
          #
          # 读取要显式指定 UTF8：Windows PowerShell 5.1 默认按 ANSI 读，
          # 中文会被读坏。写入用 UTF8Encoding($false) —— 5.1 的
          # `-Encoding utf8` 会写 BOM，JSON 解析器不认 BOM。
          $notes = [string](Get-Content 'dist/release-notes.md' -Raw -Encoding UTF8)
          $manifest = [ordered]@{
            version      = $version
            notes        = $notes
            pub_date     = (Get-Date).ToUniversalTime().ToString('o')
            download_url = "$base/$($setup.Name)"
            portable_url = if ($portable) { "$base/$($portable.Name)" } else { '' }
            release_url  = "https://github.com/2000cyj/primeval/releases/tag/$tag"
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText('dist/latest.json', $json, [System.Text.UTF8Encoding]::new($false))
          Write-Host "生成 dist/latest.json（版本 $version）"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          # 自定义文案当正文（安装步骤、命令行用法、SmartScreen 提示）
          body_path: dist/release-notes.md
          # 标题带产品名，别只显示 tag
          name: 'AgentSpace ${{ github.ref_name }}'
          files: |
            dist/*.exe
            dist/*.zip
            dist/latest.json
          draft: false
          prerelease: false
          # GitHub 自动根据 commit 生成「更新了什么」，追加在正文后面
          # （conventional commits 的 feat/fix 会被自动分类）
          generate_release_notes: true
